[package]
name = "rtoml"
version = "0.14.0"
authors = ["Samuel Colvin <s@muelcolvin.com>"]
edition = "2021"
license = "MIT"

[dependencies]
toml = {version = "1.1", features = ["preserve_order"]}
toml_writer = "1.1"
serde = "1.0.228"
pyo3 = "0.29.3"

[lib]
name = "_rtoml"
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = "fat"
codegen-units = 1
